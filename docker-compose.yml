services:
  timer:
    build: .
    environment:
      - X3_DEV=1
    ports:
      - "8080:8000"
    volumes:
      - timer-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  timer-data:

name: Deploy x3

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: x3-deploy
      cancel-in-progress: false
    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@25fcd78aa32202988cb0209b14c32ea6fa0288b9
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Trust the host (pinned key, no TOFU)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail
          EXPECTED="${{ github.sha }}"
          PREV=$(ssh ubuntu@${{ secrets.PROD_HOST }} "sha")
          echo "expected=$EXPECTED prev=$PREV"
          if [ "$PREV" = "$EXPECTED" ]; then
            echo "already at target commit; skipping"
            exit 0
          fi
          ssh ubuntu@${{ secrets.PROD_HOST }} "pull"
          NOW=$(ssh ubuntu@${{ secrets.PROD_HOST }} "sha")
          test "$NOW" = "$EXPECTED" || { echo "deployed sha $NOW != expected $EXPECTED"; exit 1; }
          ssh ubuntu@${{ secrets.PROD_HOST }} "restart"
          echo "deployed=$NOW"

      - name: Health check (origin over SSH + public)
        run: |
          set -euo pipefail
          ssh ubuntu@${{ secrets.PROD_HOST }} "health"   # localhost origin, fails hard
          code=000
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://x3.vinayakj02.com/api/health || echo 000)
            [ "$code" = "200" ] && break
            echo "public health not ready (${code}), retry $i/15"
            sleep 2
          done
          test "$code" = "200" || { echo "public health check failed"; exit 1; }
          echo "public health: $code"

      - name: Smoke check
        run: |
          set -euo pipefail
          site=$(curl -s -o /dev/null -w '%{http_code}' https://x3.vinayakj02.com)
          me=$(curl -s -o /dev/null -w '%{http_code}' https://x3.vinayakj02.com/api/auth/me)
          echo "site=$site me=$me"
          test "$site" = "200" || { echo "site check failed"; exit 1; }
          test "$me" = "401" || { echo "me check failed (expected 401)"; exit 1; }

      - name: Dump remote logs on failure
        if: failure()
        run: ssh ubuntu@${{ secrets.PROD_HOST }} "journal" || true
